<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全景VR浏览</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #panorama {
      width: 100%;
      height: 100%;
    }
    .tip {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: #fff;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <div class="tip">拖动屏幕环视 · 双指缩放</div>
  <script>
    // 支持通过 URL 参数传入自己的全景图：panorama.html?img=图片地址
    function getQuery(name) {
      var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
      var r = window.location.search.substr(1).match(reg);
      return r ? decodeURIComponent(r[2]) : null;
    }

    // 默认使用官方测试全景图，换成自己的图时改为图片地址即可（建议 2:1 等距柱状图）
    var img = getQuery('img') || 'https://pannellum.org/images/alma.jpg';

    pannellum.viewer('panorama', {
      type: 'equirectangular',          // 等距柱状投影全景图
      panorama: img,                    // 全景图地址
      autoLoad: true,                   // 自动加载
      autoRotate: -2,                   // 自动旋转速度（度/秒），负值反向
      autoRotateInactivityDelay: 3000,  // 无操作3秒后恢复自动旋转
      showControls: true,               // 显示控制按钮
      showZoomCtrl: true,               // 显示缩放按钮
      showFullscreenCtrl: true,         // 显示全屏按钮
      hfov: 110,                        // 初始视场角
      minHfov: 50,                      // 最大放大程度
      maxHfov: 150,                     // 最大缩小程度
      pitch: 0,                         // 初始俯仰角
      yaw: 0,                           // 初始水平角
      draggable: true,
      mouseZoom: true,
      keyboardZoom: true
    });
  </script>
</body>
</html>
